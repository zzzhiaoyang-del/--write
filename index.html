<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音账号拆解工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .input-section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .example-urls {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        .example-urls a {
            color: #667eea;
            text-decoration: none;
            margin-right: 15px;
        }

        .example-urls a:hover {
            text-decoration: underline;
        }

        .result-section {
            padding: 30px;
            min-height: 200px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-content {
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 20px;
            border-radius: 10px;
            color: #c33;
        }

        .success {
            background: #efe;
            border-left: 4px solid #4a4;
            padding: 20px;
            border-radius: 10px;
            color: #363;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>抖音账号拆解工具</h1>
            <p>AI 智能分析 - 秒懂爆款逻辑</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input
                    type="text"
                    id="urlInput"
                    placeholder="请输入抖音博主主页链接或详情页链接..."
                    value=""
                />
                <button class="btn" id="analyzeBtn" onclick="analyzeAccount()">
                    开始拆解
                </button>
            </div>
            <div class="example-urls">
                示例链接：
                <a href="#" onclick="fillExample('https://www.douyin.com/user/MS4wLjABAAAA...')">博主主页</a>
                <a href="#" onclick="fillExample('https://v.douyin.com/...')">视频详情</a>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div style="text-align: center; color: #999; padding: 60px 20px;">
                输入链接后点击"开始拆解"，AI 将为您深度分析账号爆款逻辑
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        function fillExample(url) {
            document.getElementById('urlInput').value = url;
            return false;
        }

        async function analyzeAccount() {
            const urlInput = document.getElementById('urlInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultSection = document.getElementById('resultSection');

            const url = urlInput.value.trim();

            if (!url) {
                alert('请输入有效的 URL');
                return;
            }

            // 禁用按钮
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = '分析中...';

            // 显示加载状态
            resultSection.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在抓取内容并分析中，请稍候...</p>
                </div>
            `;

            try {
                // 发送请求
                const response = await fetch(`${API_BASE_URL}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 显示成功提示
                resultSection.innerHTML = `
                    <div class="success">
                        内容抓取成功！AI 正在分析中...
                    </div>
                    <div class="result-content" id="streamResult"></div>
                `;

                const streamResult = document.getElementById('streamResult');

                // 读取流式数据
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 处理 SSE 格式的数据
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop(); // 保留最后一个不完整的部分

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6);

                            if (data === '[DONE]') {
                                console.log('Stream completed');
                                continue;
                            }

                            if (data.startsWith('[ERROR]')) {
                                throw new Error(data.substring(8));
                            }

                            // 追加内容
                            streamResult.textContent += data;

                            // 自动滚动到底部
                            resultSection.scrollTop = resultSection.scrollHeight;
                        }
                    }
                }

                console.log('Analysis completed');

            } catch (error) {
                console.error('Error:', error);
                resultSection.innerHTML = `
                    <div class="error">
                        <strong>分析失败：</strong><br>
                        ${error.message}<br><br>
                        <small>请检查：<br>
                        1. 后端服务是否正常运行（python main.py）<br>
                        2. URL 是否正确<br>
                        3. 网络连接是否正常</small>
                    </div>
                `;
            } finally {
                // 恢复按钮
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '开始拆解';
            }
        }

        // 支持回车键提交
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeAccount();
            }
        });
    </script>
</body>
</html>
